services:
  postgres:
    image: postgres:17-alpine
    container_name: jala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jala
      POSTGRES_PASSWORD: jala_dev_password
      POSTGRES_DB: jala
    ports:
      - "5432:5432"
    volumes:
      - jala-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jala -d jala"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jala-pgdata:
